services:
  zotero-mcp:
    image: zotero-mcp:0.13.0-jina-cuda
    build:
      dockerfile: Dockerfile.cuda
    environment:
      ZOTERO_SEMANTIC_ENABLED: "true"
    gpus: all
    volumes:
      - type: bind
        source: ./config/zotero-mcp-config.json
        target: /root/.config/zotero-mcp/config.json
        read_only: false
      - type: volume
        source: zotero-mcp-chroma
        target: /root/.config/zotero-mcp/chroma_db
      - type: volume
        source: jina-model-cache
        target: /root/.cache/huggingface

volumes:
  zotero-mcp-chroma:
  jina-model-cache:
    external: true
    name: jina-embedding-benchmark_jina-model-cache
